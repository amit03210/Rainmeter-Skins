[Rainmeter]
Update=1000
BackgroundMode=2
SolidColor=22,22,26,235
DynamicWindowSize=1
AccurateText=1

[Variables]
MaxItems=10
ListFile=#@#Links.txt
PendingURL=

; --- CLIPBOARD & PARSER ---
[MeasureClipboard]
Measure=Plugin
Plugin=InputText
; Uses PowerShell silently to read clipboard without extra plugins
[MeasureGetClip]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -Command "Get-Clipboard"
OutputType=ANSI
FinishAction=[!CommandMeasure MeasureLua "OnClipboardRead()"]

[MeasureWebTitle]
Measure=WebParser
URL=#PendingURL#
; Universal RegExp: catches <title> even with attributes or newlines
RegExp=(?siU)<title[^>]*>(.*?)</title>
StringIndex=1
DecodeCharacterReference=1
UpdateRate=-1
FinishAction=[!CommandMeasure MeasureLua "OnTitleFetched()"]
OnConnectErrorAction=[!CommandMeasure MeasureLua "OnTitleFailed()"]

[MeasureLua]
Measure=Script
ScriptFile=WatchLater.lua

; --- HEADER UI ---
[MeterHeader]
Meter=String
X=12
Y=10
FontFace=Segoe UI
FontSize=11
FontWeight=700
FontColor=255,255,255,255
Text=Watch Later / Bookmarks

[MeterAddBtn]
Meter=String
X=270
Y=10
StringAlign=Right
FontFace=Segoe UI
FontSize=10
FontWeight=600
FontColor=100,200,255,255
SolidColor=40,45,55,255
Padding=6,3,6,3
Text=+ Paste Link
LeftMouseUpAction=[!CommandMeasure MeasureGetClip "Run"]

